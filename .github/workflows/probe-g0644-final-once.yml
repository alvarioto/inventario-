name: Probe final exact G0644

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-g0644-final-once.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact hobbyDB item
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"item":{"type":"figure","title":"Marvel Legends X-Men Wolverine (Weapon X)","character":"Wolverine","manufacturer":"Hasbro","line":"Marvel Legends","sku":"G0644"}}'
          HTTP=$(curl -sS -o response.json -w '%{http_code}' -X POST 'https://frikivault-hobbydb-api-aldipo7292-6258.vercel.app/api/hobbydb-value' -H 'Content-Type: application/json' --data "$BODY")
          echo "HTTP=$HTTP"
          cat response.json
          test "$HTTP" = "200"
          node - <<'NODE'
          const fs=require('fs'); const data=JSON.parse(fs.readFileSync('response.json','utf8'));
          if(data.status!=='completed') throw new Error(JSON.stringify(data));
          if(data.value?.catalogItemId!=='1760345') throw new Error('Wrong hobbyDB id: '+data.value?.catalogItemId);
          if(Number(data.value?.amount)!==34) throw new Error('Wrong amount: '+data.value?.amount);
          if(data.value?.currency!=='USD') throw new Error('Wrong currency');
          if(!/Wolverine.*Weapon X/i.test(data.value?.title||'')) throw new Error('Wrong title: '+data.value?.title);
          console.log('FINAL_EXACT_G0644_OK');
          NODE
