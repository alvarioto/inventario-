name: Apply AF411 autocomplete patch

on:
  push:
    branches:
      - fix/actionfigure411-autocomplete-click
    paths:
      - scripts/patch-af411-autocomplete.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/actionfigure411-autocomplete-click
      - name: Apply patch
        run: python3 scripts/patch-af411-autocomplete.py
      - name: Commit patch
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add browser-extension/background.js tests/actionfigure411.mjs
          git commit -m 'Click ActionFigure411 autocomplete result'
          git push origin HEAD:fix/actionfigure411-autocomplete-click
