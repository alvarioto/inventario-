name: Apply research price improvement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-research-prices.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        shell: bash
        run: |
          sed -i 's/conserva estos datos verificables/conserva los datos verificables/' scripts/patch-research-prices.py
          sed -i "s/warnings.push('El resumen automático no pudo estructurarse;/warnings.push('Resumen IA: el resumen automático no pudo estructurarse;/" scripts/patch-research-prices.py
          python scripts/patch-research-prices.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit improvement
        shell: bash
        run: |
          rm .github/workflows/one-shot-research-prices.yml scripts/patch-research-prices.py
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs src/App.tsx tests/core.mjs .github/workflows/one-shot-research-prices.yml scripts/patch-research-prices.py
          git commit -m 'Improve research price extraction and clarity'
          git push origin main
