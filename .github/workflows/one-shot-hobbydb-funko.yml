name: Apply hobbyDB Funko pricing
on:
  push:
    branches: [main]
    paths:
      - scripts/switch-funko-hobbydb.mjs
      - .github/workflows/one-shot-hobbydb-funko.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hobbyDB pricing patch
        run: node scripts/switch-funko-hobbydb.mjs
      - name: Update hobbyDB regressions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='tests/core.mjs';
          let t=fs.readFileSync(p,'utf8');
          t=t.replace("assert.match(hobbyPrompts[0],/hobbyDB/Pop Price Guide/);","assert.ok(hobbyPrompts[0].includes('hobbyDB/Pop Price Guide'));");
          t=t.replace("assert.match(aiCoreSource,/contrasta únicamente con StockX y eBay vendidos\\/completados/);","assert.ok(aiCoreSource.includes('hobbyDB/Pop Price Guide'));");
          t=t.replace("assert.match(currentCoreSource,/PriceCharting va primero/);","assert.ok(currentCoreSource.includes('hobbyDB/Pop Price Guide'));");
          t=t.replace("assert.doesNotMatch(currentCoreSource,/ppg:'https:\\/\\/www\\.hobbydb\\.com/);","assert.ok(currentCoreSource.includes(\"ppg:'https://www.hobbydb.com\"));");
          fs.writeFileSync(p,t);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated patch
        run: |
          rm scripts/switch-funko-hobbydb.mjs
          rm .github/workflows/one-shot-hobbydb-funko.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Use hobbyDB with market fallback for Funko pricing"
          git push
