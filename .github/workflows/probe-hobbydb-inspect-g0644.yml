name: Inspect hobbyDB G0644 candidates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-hobbydb-inspect-g0644.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch candidates
        run: |
          set -euo pipefail
          curl -sS 'https://frikivault-hobbydb-api-aldipo7292-6258.vercel.app/api/hobbydb-inspect-g0644' > inspect.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('inspect.json','utf8'));
          for(const [q,rows] of Object.entries(data)){
            console.log('\nQUERY='+q);
            for(const r of rows){
              console.log(JSON.stringify(r));
            }
          }
          NODE
