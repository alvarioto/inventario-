name: Apply AI button hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run AI button hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hotfix
        run: python scripts/patch-ai-button-hotfix.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated hotfix
        shell: bash
        run: |
          set -e
          rm scripts/patch-ai-button-hotfix.py .github/workflows/one-shot-ai-button-hotfix.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Fix unified AI analyze button"
          git push
