name: Restore hobbyDB priority

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-restore-hobbydb-primary.py
      - .github/workflows/one-shot-restore-hobbydb-primary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-restore-hobbydb-primary.py
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Check backend syntax
        run: node --check api/hobbydb-value.mjs
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/App.tsx src/lib/api.ts src/lib/ai-core.mjs api/hobbydb-value.mjs tests/core.mjs
          git commit -m 'Restore hobbyDB priority and currency selector'
          git push origin main
