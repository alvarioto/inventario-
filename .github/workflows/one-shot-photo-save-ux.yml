name: Apply photo upload and save UX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-photo-save-ux.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-photo-save-ux.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/one-shot-photo-save-ux.yml scripts/patch-photo-save-ux.py
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/App.tsx src/lib/inventory.ts src/styles.css .github/workflows/one-shot-photo-save-ux.yml scripts/patch-photo-save-ux.py
          git commit -m 'Improve photo uploads compression and save confirmation'
          git push origin main
