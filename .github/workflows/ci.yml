name: FrikiVault CI
on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check server/core.mjs
      - run: node --check server/index.mjs
