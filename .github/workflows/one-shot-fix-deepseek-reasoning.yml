name: Fix DeepSeek reasoning parameter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Apply DeepSeek reasoning fix v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove invalid reasoning_effort and update regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('src/lib/ai-core.mjs')
          s = core.read_text()
          old = "const body={model,messages,max_tokens:maxTokens,stream:false,thinking:{type:'disabled'},reasoning_effort:'none'};"
          new = "const body={model,messages,max_tokens:maxTokens,stream:false,thinking:{type:'disabled'}};"
          if old not in s:
              raise SystemExit('Invalid reasoning_effort pattern not found')
          core.write_text(s.replace(old, new, 1))

          tests = Path('tests/core.mjs')
          t = tests.read_text()
          old_test = " assert.equal(body.reasoning_effort,'none');"
          new_test = " assert.equal(body.reasoning_effort,undefined);"
          if old_test not in t:
              raise SystemExit('Old reasoning_effort regression not found')
          tests.write_text(t.replace(old_test, new_test, 1))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-deepseek-reasoning.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Fix DeepSeek analyze request"
          git push
# one-shot trigger v2
