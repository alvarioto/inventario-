name: Fix DeepSeek reasoning parameter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Apply DeepSeek reasoning parameter fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove invalid reasoning_effort
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ai-core.mjs')
          s = p.read_text()
          old = "const body={model,messages,max_tokens:maxTokens,stream:false,thinking:{type:'disabled'},reasoning_effort:'none'};"
          new = "const body={model,messages,max_tokens:maxTokens,stream:false,thinking:{type:'disabled'}};"
          if old not in s:
              raise SystemExit('Invalid reasoning_effort pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-deepseek-reasoning.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Fix DeepSeek analyze request"
          git push
# one-shot trigger
