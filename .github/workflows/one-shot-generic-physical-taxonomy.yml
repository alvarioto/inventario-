name: Apply generic physical taxonomy

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-generic-physical-taxonomy.py
      - .github/workflows/one-shot-generic-physical-taxonomy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-generic-physical-taxonomy.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs tests/core.mjs
          git commit -m 'Classify collectibles by physical object first'
          git push origin main
