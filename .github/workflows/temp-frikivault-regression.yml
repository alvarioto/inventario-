name: Temporary FrikiVault regression gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/ai-core.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/temp-frikivault-regression.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
