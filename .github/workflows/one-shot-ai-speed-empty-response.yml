name: Apply AI speed empty-response fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ai-speed-empty-response.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: |
          sed -i "s/retries=1}){/retries=0}){/" scripts/patch-ai-speed-empty-response.py
          python scripts/patch-ai-speed-empty-response.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          rm .github/workflows/one-shot-ai-speed-empty-response.yml scripts/patch-ai-speed-empty-response.py
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs tests/core.mjs .github/workflows/one-shot-ai-speed-empty-response.yml scripts/patch-ai-speed-empty-response.py
          git commit -m 'Speed up photo analysis and recover empty AI responses'
          git push origin main
