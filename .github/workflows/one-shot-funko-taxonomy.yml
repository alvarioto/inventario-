name: Apply Funko taxonomy migration

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-funko-taxonomy.py
      - scripts/patch-funko-taxonomy-tests.py
      - .github/workflows/one-shot-funko-taxonomy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply taxonomy patch
        run: python scripts/patch-funko-taxonomy.py
      - name: Update taxonomy tests
        run: python scripts/patch-funko-taxonomy-tests.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs src/App.tsx tests/core.mjs
          git commit -m 'Model Funko formats separately from variants'
          git push origin main
