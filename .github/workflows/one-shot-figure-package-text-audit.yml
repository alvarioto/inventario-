name: Apply figure package text audit patch

on:
  push:
    branches: [fix/figure-package-text-audit]
    paths:
      - scripts/patch-figure-package-text-audit.py
      - .github/workflows/one-shot-figure-package-text-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-figure-package-text-audit.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit patched code
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs tests/core.mjs
          git commit -m 'Prefer literal package text over visual figure guesses'
          git push origin HEAD:fix/figure-package-text-audit
