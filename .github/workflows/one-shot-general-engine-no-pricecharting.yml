name: Apply general collector engine

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-general-engine-v2.py
      - scripts/run-general-engine-v3.py
      - .github/workflows/one-shot-general-engine-no-pricecharting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: python scripts/run-general-engine-v3.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs src/lib/direct-ai.ts src/components/DirectAiSettings.tsx src/types.ts server/index.mjs .env.server.example tests/core.mjs
          git commit -m 'Generalize collectible recognition and remove PriceCharting'
          git push origin main
