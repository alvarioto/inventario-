name: Apply PriceCharting first and restore buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pricecharting-first-restore-buttons.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-pricecharting-first-and-restore-buttons.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          rm .github/workflows/one-shot-pricecharting-first-restore-buttons.yml scripts/patch-pricecharting-first-and-restore-buttons.py
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs src/components/DirectAiSettings.tsx src/App.tsx src/styles.css tests/core.mjs .github/workflows/one-shot-pricecharting-first-restore-buttons.yml scripts/patch-pricecharting-first-and-restore-buttons.py
          git commit -m 'Prioritize PriceCharting and restore original form buttons'
          git push origin main
