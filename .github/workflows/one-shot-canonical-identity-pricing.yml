name: Apply canonical identity pricing fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run canonical identity pricing patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply patch
        run: python scripts/patch-canonical-identity-pricing.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          rm scripts/patch-canonical-identity-pricing.py
          rm .github/workflows/one-shot-canonical-identity-pricing.yml
          git config user.name "alvarioto"
          git config user.email "aldipo7292@gmail.com"
          git add -A
          git commit -m "Resolve canonical product identity before pricing"
          git push origin main
