name: Fix final App legacy link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove obsolete source link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text(encoding='utf-8')
          old='{research.links.priceCharting && <a href={research.links.priceCharting} target="_blank" rel="noreferrer">PriceCharting</a>}'
          if old not in s:
              raise SystemExit('Legacy App link not found')
          s=s.replace(old,'',1)
          if 'priceCharting' in s or 'PriceCharting' in s:
              raise SystemExit('App.tsx still contains legacy provider')
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit App cleanup
        shell: bash
        run: |
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove obsolete pricing link from App"
          git push origin HEAD:main
