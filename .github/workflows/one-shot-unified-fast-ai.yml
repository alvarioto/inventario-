name: Apply unified fast AI flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run unified fast AI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Make regex replacements literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-unified-fast-ai.py')
          s=p.read_text()
          needle='import re\n'
          shim="""import re\n_real_subn = re.subn\ndef _literal_subn(pattern, repl, string, count=0, flags=0):\n    if isinstance(repl, str):\n        return _real_subn(pattern, lambda _m: repl, string, count=count, flags=flags)\n    return _real_subn(pattern, repl, string, count=count, flags=flags)\nre.subn = _literal_subn\n"""
          if needle not in s:
              raise SystemExit('import re not found')
          p.write_text(s.replace(needle,shim,1))
          PY
      - name: Apply patch
        run: python scripts/patch-unified-fast-ai.py
      - name: Remove obsolete multi-search regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/core.mjs')
          s=p.read_text()
          s=s.replace("assert.match(coreSource,/funko-specialist/);\n","")
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          set -e
          rm scripts/patch-unified-fast-ai.py .github/workflows/one-shot-unified-fast-ai.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Unify identification and pricing into one fast AI flow"
          git push
