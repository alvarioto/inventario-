name: Probe G0644 strict hobbyDB

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-g0644-strict-once.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query strict G0644
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"item":{"type":"figure","title":"Marvel Legends X-Men Wolverine (Weapon X)","character":"Wolverine","manufacturer":"Hasbro","line":"Marvel Legends","sku":"G0644"}}'
          HTTP=$(curl -sS -o response.json -w '%{http_code}' -X POST 'https://frikivault-hobbydb-api-aldipo7292-6258.vercel.app/api/hobbydb-value' -H 'Content-Type: application/json' --data "$BODY")
          echo "HTTP=$HTTP"
          cat response.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('response.json','utf8'));
          if (data.status==='completed') {
            if (data.value?.catalogItemId==='2528420') throw new Error('Old wrong Wolverine still selected');
            if (data.value?.currency!=='USD') throw new Error('Expected USD');
            console.log('STRICT_MATCH='+JSON.stringify(data.value));
          } else {
            console.log('STRICT_REJECT='+JSON.stringify(data));
          }
          NODE
