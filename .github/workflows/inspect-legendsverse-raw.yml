name: Inspect LegendsVerse raw XLSX
on:
  push:
    branches: [codex/legendsverse-year-fix]
    paths:
      - .github/workflows/inspect-legendsverse-raw.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect raw workbook XML
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://legendsverse.com/storage/legendsverse-price-guide.xlsx' -o /tmp/guide.xlsx
          python - <<'PY'
          import zipfile,re
          z=zipfile.ZipFile('/tmp/guide.xlsx')
          print('FILES', [n for n in z.namelist() if 'worksheet' in n or 'sharedStrings' in n][:20])
          shared=z.read('xl/sharedStrings.xml').decode('utf-8','ignore')
          sheet=z.read('xl/worksheets/sheet1.xml').decode('utf-8','ignore')
          m=re.search(r'<row[^>]*r="10"[^>]*>(.*?)</row>',sheet,re.S)
          print('ROW10_RAW',m.group(0) if m else 'NONE')
          # Locate Black Bolt & Triton in sharedStrings and print its index.
          sis=re.findall(r'<si\b[^>]*>(.*?)</si>',shared,re.S)
          vals=[]
          for i,si in enumerate(sis):
              txt=''.join(re.findall(r'<t\b[^>]*>(.*?)</t>',si,re.S))
              vals.append(txt.replace('&amp;','&'))
              if 'Black Bolt' in txt or txt in ['Figure','Wave','Exclusive','Release year','Retail price','Market value']:
                  print('SHARED',i,txt)
          idx=next((i for i,v in enumerate(vals) if 'Black Bolt & Triton' in v),None)
          print('BLACK_BOLT_SHARED_INDEX',idx)
          if idx is not None:
              for rm in re.finditer(r'<row\b[^>]*>(.*?)</row>',sheet,re.S):
                  if re.search(rf'<v>{idx}</v>',rm.group(1)):
                      print('BLACK_BOLT_ROW_RAW',rm.group(0))
                      break
          PY
