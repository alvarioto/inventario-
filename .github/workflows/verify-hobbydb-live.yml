name: Verificar hobbyDB live
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-hobbydb-live.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar Vercel y comprobar CORS + Cruella Diamond
        shell: bash
        run: |
          set -u
          URL='https://frikivault-hobbydb-api-aldipo7292-6258.vercel.app/api/hobbydb-value'
          ORIGIN='https://frikivault-alvarioto-2026.web.app'
          BODY='{"item":{"character":"Cruella de Vil","popNumber":"1663","funkoVariant":"Diamond Collection"}}'

          for i in $(seq 1 30); do
            echo "Intento $i"

            PRE_CODE=$(curl -sS -D pre.headers -o /dev/null -w '%{http_code}' -X OPTIONS "$URL" \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type' || true)
            PRE_ORIGIN=$(awk 'BEGIN{IGNORECASE=1} /^Access-Control-Allow-Origin:/ {gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' pre.headers)
            echo "Preflight HTTP=$PRE_CODE ACAO=$PRE_ORIGIN"

            CODE=$(curl -sS -D post.headers -o response.json -w '%{http_code}' -X POST "$URL" \
              -H "Origin: $ORIGIN" \
              -H 'Content-Type: application/json' \
              --data "$BODY" || true)
            POST_ORIGIN=$(awk 'BEGIN{IGNORECASE=1} /^Access-Control-Allow-Origin:/ {gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' post.headers)
            echo "POST HTTP=$CODE ACAO=$POST_ORIGIN"
            cat response.json 2>/dev/null || true
            echo

            if [ "$PRE_CODE" = "204" ] && [ "$PRE_ORIGIN" = "$ORIGIN" ] \
              && [ "$CODE" = "200" ] && [ "$POST_ORIGIN" = "$ORIGIN" ] \
              && jq -e '.status == "completed" and .value.currency == "USD" and (.value.amount > 0) and (.value.variant | ascii_downcase | contains("diamond"))' response.json >/dev/null 2>&1; then
              echo 'OK: CORS correcto y Cruella #1663 Diamond devuelve Estimated Value.'
              exit 0
            fi

            sleep 10
          done

          echo 'Falló CORS o la valoración exacta de Cruella #1663 Diamond.'
          exit 1
