name: Prepare ActionFigure411 browser dependencies

on:
  push:
    branches: [codex/actionfigure411-browser-search]
    paths:
      - .github/workflows/prepare-actionfigure411-browser.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/actionfigure411-browser-search
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install serverless browser dependencies
        run: |
          npm install --save @sparticuz/chromium-min@^141.0.0 puppeteer-core@^23.11.0
          npm install --save-dev @sparticuz/chromium@^141.0.0
      - name: Commit lockfile and dependencies
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add package.json package-lock.json
          git commit -m 'Add serverless Chromium dependencies'
          git push origin HEAD:codex/actionfigure411-browser-search
