name: Sonda hobbyDB búsqueda automática
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-hobbydb-once.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validar CORS y Cruella 1663 Diamond Collection
        shell: bash
        run: |
          set -euo pipefail
          URL='https://frikivault-hobbydb-api-aldipo7292-6258.vercel.app/api/hobbydb-value'
          ORIGIN='https://frikivault-alvarioto-2026.web.app'
          BODY='{"item":{"character":"Cruella de Vil","popNumber":"1663","funkoVariant":"Diamond Collection"}}'

          PRE_CODE=$(curl -sS -D pre.headers -o /dev/null -w '%{http_code}' -X OPTIONS "$URL" \
            -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' || true)
          PRE_ORIGIN=$(awk 'BEGIN{IGNORECASE=1} /^Access-Control-Allow-Origin:/ {gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' pre.headers)
          echo "PRE HTTP=$PRE_CODE ACAO=$PRE_ORIGIN"

          CODE=$(curl -sS -D post.headers -o response.json -w '%{http_code}' -X POST "$URL" \
            -H "Origin: $ORIGIN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" || true)
          POST_ORIGIN=$(awk 'BEGIN{IGNORECASE=1} /^Access-Control-Allow-Origin:/ {gsub(/\r/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' post.headers)
          echo "POST HTTP=$CODE ACAO=$POST_ORIGIN"
          cat response.json
          echo

          test "$PRE_CODE" = "204"
          test "$PRE_ORIGIN" = "$ORIGIN"
          test "$CODE" = "200"
          test "$POST_ORIGIN" = "$ORIGIN"
          node -e "const x=require('./response.json'); const v=x?.value; if(!(v?.amount>0)||v?.currency!=='USD'||!String(v?.variant||'').toLowerCase().includes('diamond')) process.exit(1); console.log('VALUE='+v.amount+' '+v.currency+' ID='+v.catalogItemId+' URL='+v.url)"
