name: Sonda hobbyDB búsqueda automática
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-hobbydb-once.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar cargador de búsqueda hobbyDB
        shell: bash
        run: |
          set -euo pipefail
          URL='https://frikivault-hobbydb-api-aldipo7292-6258.vercel.app/api/hobbydb-debug'
          CODE=$(curl -sS -o response.json -w '%{http_code}' "$URL" || true)
          echo "HTTP=$CODE"
          cat response.json || true
          echo
          exit 0
