name: hobbyDB structured exact fallback

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-hobbydb-structured-exact.py
      - .github/workflows/one-shot-hobbydb-structured-exact.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-hobbydb-structured-exact.py
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Check backend
        run: node --check api/hobbydb-value.mjs
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add api/hobbydb-value.mjs tests/core.mjs
          git commit -m 'Match generic hobbyDB items by structured identity'
          git push origin main
