name: Guarantee Funko visible price
on:
  push:
    branches: [main]
    paths:
      - scripts/ensure-funko-price.mjs
      - .github/workflows/one-shot-guarantee-funko-price.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guaranteed Funko price fallback
        run: node scripts/ensure-funko-price.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated guaranteed-price fix
        run: |
          rm scripts/ensure-funko-price.mjs
          rm .github/workflows/one-shot-guarantee-funko-price.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Guarantee a visible Funko valuation"
          git push
