name: Apply save unblock hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-save.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hotfix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/lib/inventory.ts')
          text = p.read_text()
          text = text.replace("  getDocFromServer,\n", "")
          old = '''\n  // No damos el guardado por bueno hasta comprobar desde el servidor que las fotos\n  // realmente quedaron dentro del documento. Evita falsos \"Guardado\" en iOS/Safari.\n  const expectedPhotos = (draft.imageUrls || []).filter(Boolean).length;\n  if (expectedPhotos) {\n    const stored = await getDocFromServer(doc(db, 'users', uid, 'items', savedId));\n    const storedPhotos = Array.isArray(stored.data()?.imageUrls) ? stored.data()!.imageUrls.filter(Boolean).length : 0;\n    if (storedPhotos != expectedPhotos) {\n      throw new Error(`Firebase guardó ${storedPhotos} de ${expectedPhotos} fotos. No cierres la ficha y vuelve a intentarlo.`);\n    }\n  }\n'''
          if old not in text:
              raise SystemExit('No se encontró la verificación bloqueante de Firestore')
          text = text.replace(old, '\n')
          p.write_text(text)

          p = Path('src/App.tsx')
          text = p.read_text()
          old = '''  const [draft, setDraft] = useState<InventoryDraft>(initial);\n  const [previews, setPreviews] = useState<string[]>(initial.imageUrls || []);\n'''
          new = '''  const [draft, setDraft] = useState<InventoryDraft>(initial);\n  const [pendingPhotos, setPendingPhotos] = useState<File[]>(initialPhotos);\n  const [previews, setPreviews] = useState<string[]>(initial.imageUrls || []);\n'''
          if old not in text:
              raise SystemExit('No se encontró estado inicial de ItemForm')
          text = text.replace(old, new, 1)

          old = '''        setPreviews((current) => [...current, ...urls].slice(0, maxCloudPhotos()));\n      })\n'''
          new = '''        setPreviews((current) => [...current, ...urls].slice(0, maxCloudPhotos()));\n        setPendingPhotos([]);\n      })\n'''
          if old not in text:
              raise SystemExit('No se encontró subida inicial de fotos')
          text = text.replace(old, new, 1)

          old = '''    const existing = (draft.imageUrls || []).length;\n    const limit = maxCloudPhotos();\n    const raw = [...files].slice(0, Math.max(0, limit - existing));\n'''
          new = '''    const existing = (draft.imageUrls || []).length + pendingPhotos.length;\n    const limit = maxCloudPhotos();\n    const raw = [...files].slice(0, Math.max(0, limit - existing));\n'''
          if old not in text:
              raise SystemExit('No se encontró cálculo de fotos existentes')
          text = text.replace(old, new, 1)

          old = '''      const prepared = await Promise.all(raw.map((file) => prepareImage(file)));\n      const uploaded = await Promise.all(prepared.map((file) => uploadItemImage(file)));\n'''
          new = '''      const prepared = await Promise.all(raw.map((file) => prepareImage(file)));\n      setPendingPhotos((current) => [...current, ...prepared].slice(0, limit));\n      const uploaded = await Promise.all(prepared.map((file) => uploadItemImage(file)));\n'''
          if old not in text:
              raise SystemExit('No se encontró preparación de fotos añadidas')
          text = text.replace(old, new, 1)

          old = '''      setPreviews((current) => [...current, ...urls].slice(0, limit));\n    } catch (error) {\n'''
          new = '''      setPreviews((current) => [...current, ...urls].slice(0, limit));\n      setPendingPhotos([]);\n    } catch (error) {\n'''
          if old not in text:
              raise SystemExit('No se encontró final de addPhotos')
          text = text.replace(old, new, 1)

          old = '''      if (photoPreparing) throw new Error('Espera a que terminen de prepararse las fotos.');\n      if (photoError) throw new Error(photoError);\n      const finalDraft: InventoryDraft = { ...baseDraft, research };\n      await saveItem(finalDraft, item?.id);\n      onSaved();\n    } finally { setBusy(false); }\n'''
          new = '''      if (photoPreparing) throw new Error('Espera a que terminen de prepararse las fotos.');\n      let finalDraft: InventoryDraft = { ...baseDraft, research };\n      if (pendingPhotos.length) {\n        setPhotoError('');\n        const room = Math.max(0, maxCloudPhotos() - (baseDraft.imageUrls || []).length);\n        const uploaded = await Promise.all(pendingPhotos.slice(0, room).map((file) => uploadItemImage(file)));\n        finalDraft = {\n          ...finalDraft,\n          imageUrls: [...(baseDraft.imageUrls || []), ...uploaded.map((x) => x.url).filter(Boolean)].slice(0, maxCloudPhotos()),\n          imagePaths: [...(baseDraft.imagePaths || []), ...uploaded.map((x) => x.path).filter(Boolean)]\n        };\n      }\n      await saveItem(finalDraft, item?.id);\n      setPendingPhotos([]);\n      onSaved();\n    } catch (error) {\n      setPhotoError(error instanceof Error ? error.message : 'No se pudo guardar el artículo.');\n    } finally { setBusy(false); }\n'''
          if old not in text:
              raise SystemExit('No se encontró submit bloqueante')
          text = text.replace(old, new, 1)

          old = '''<button className="primary" disabled={busy || photoPreparing || !!photoError || !draft.title.trim()}><Check size={18}/>{busy ? 'Guardando…' : photoPreparing ? 'Preparando fotos…' : 'Guardar'}</button>'''
          new = '''<button className="primary" disabled={busy || photoPreparing || !draft.title.trim()}><Check size={18}/>{busy ? 'Guardando…' : photoPreparing ? 'Preparando fotos…' : 'Guardar'}</button>'''
          if old not in text:
              raise SystemExit('No se encontró botón Guardar bloqueado por photoError')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('tests/core.mjs')
          text = p.read_text()
          old = '''assert.match(appSource,/disabled=\\{busy \\|\\| photoPreparing \\|\\| !!photoError/);\nassert.match(inventorySource,/getDocFromServer/);\nassert.match(inventorySource,/Firebase guardó \\$\\{storedPhotos\\} de \\$\\{expectedPhotos\\} fotos/);\n'''
          new = '''assert.match(appSource,/const \\[pendingPhotos, setPendingPhotos\\] = useState<File\\[]>\\(initialPhotos\\)/);\nassert.match(appSource,/pendingPhotos\\.slice\\(0, room\\)\\.map\\(\\(file\\) => uploadItemImage\\(file\\)\\)/);\nassert.match(appSource,/disabled=\\{busy \\|\\| photoPreparing \\|\\| !draft\\.title\\.trim\\(\\)\\}/);\nassert.doesNotMatch(inventorySource,/getDocFromServer/);\n'''
          if old not in text:
              raise SystemExit('No se encontró bloque de tests anterior')
          text = text.replace(old, new)
          p.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit hotfix
        shell: bash
        run: |
          rm .github/workflows/one-shot-fix-save.yml
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add -A
          git commit -m 'Unblock item save and retry photo persistence'
          git push origin main
