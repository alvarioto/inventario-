name: Apply condition fix v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run condition fix v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/fix-condition.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit
        run: |
          rm scripts/fix-condition.mjs
          rm .github/workflows/one-shot-condition-fix-v2.yml
          rm -f .github/workflows/one-shot-normalize-ai-condition.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Normalize AI condition values"
          git push
# trigger
