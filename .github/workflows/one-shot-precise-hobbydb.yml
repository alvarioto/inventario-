name: Precise hobbyDB Funko matching
on:
  push:
    branches: [main]
    paths:
      - scripts/precise-hobbydb-funko.mjs
      - .github/workflows/one-shot-precise-hobbydb.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply precise hobbyDB matching
        run: node scripts/precise-hobbydb-funko.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated patch
        run: |
          rm scripts/precise-hobbydb-funko.mjs
          rm .github/workflows/one-shot-precise-hobbydb.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Require exact hobbyDB Funko metadata"
          git push
