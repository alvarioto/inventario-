name: Apply exact Funko name number fix
on:
  push:
    branches: [main]
    paths:
      - scripts/force-funko-number-search.mjs
      - .github/workflows/one-shot-force-funko-number.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact search patch
        run: node scripts/force-funko-number-search.mjs
      - name: Make the regression assert the PriceCharting call, not the later fallback call
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='tests/core.mjs';
          let t=fs.readFileSync(p,'utf8');
          t=t.replace("let exactPcPrompt='';","let exactPcPrompts=[];");
          t=t.replace("exactPcPrompt=String(body.messages?.[0]?.content||'');","exactPcPrompts.push(String(body.messages?.[0]?.content||''));");
          t=t.replace("assert.equal(exactPcQueryResearch.searchIdentity,'Éomer 1982');\nassert.match(exactPcPrompt,/Eomer 1982/);","assert.equal(exactPcQueryResearch.searchIdentity,'Éomer 1982');\nconst exactPcPrompt=exactPcPrompts.find(x=>x.includes('MODO PRICECHARTING'))||'';\nassert.ok(exactPcPrompt,'No se ejecutó la llamada específica de PriceCharting');\nassert.match(exactPcPrompt,/Eomer 1982/);");
          fs.writeFileSync(p,t);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated patch
        run: |
          rm scripts/force-funko-number-search.mjs
          rm .github/workflows/one-shot-force-funko-number.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Force Funko name and number pricing search"
          git push
