name: Apply exact Funko name number fix
on:
  push:
    branches: [main]
    paths:
      - scripts/force-funko-number-search.mjs
      - .github/workflows/one-shot-force-funko-number.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact search patch
        run: node scripts/force-funko-number-search.mjs
      - name: Make the regression exercise exact PriceCharting query through final valuation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='tests/core.mjs';
          let t=fs.readFileSync(p,'utf8');
          t=t.replace("let exactPcPrompt='';","let exactPcPrompts=[];");
          t=t.replace("exactPcPrompt=String(body.messages?.[0]?.content||'');\n  return new Response(JSON.stringify({content:[{type:'web_search_tool_result',content:[]}]}),{status:200,headers:{'content-type':'application/json'}});","exactPcPrompts.push(String(body.messages?.[0]?.content||''));\n  const prompt=String(body.messages?.[0]?.content||'');\n  if(prompt.includes('MODO PRICECHARTING')) return new Response(JSON.stringify({content:[{type:'web_search_tool_result',content:[{type:'web_search_result',title:'Eomer #1982 Prices | Funko POP Movies',url:'https://www.pricecharting.com/game/funko-pop-movies/eomer-1982',cited_text:'Eomer #1982 · In Box $16.00'}]}]}),{status:200,headers:{'content-type':'application/json'}});\n  return new Response(JSON.stringify({content:[{type:'web_search_tool_result',content:[]}]}),{status:200,headers:{'content-type':'application/json'}});");
          t=t.replace("if(String(url).includes('frankfurter.dev'))return new Response('{}',{status:404});","if(String(url).includes('frankfurter.dev'))return new Response(JSON.stringify({rate:.9}),{status:200,headers:{'content-type':'application/json'}});");
          t=t.replace("assert.equal(exactPcQueryResearch.searchIdentity,'Éomer 1982');\nassert.match(exactPcPrompt,/Eomer 1982/);\nassert.match(exactPcPrompt,/NO puedes quitarlo ni buscar solo el nombre/);\nassert.match(exactPcPrompt,/q=Eomer%201982/);\nassert.doesNotMatch(exactPcPrompt,/Eomer Funko Pop/);","assert.equal(exactPcQueryResearch.searchIdentity,'Éomer 1982');\nconst exactPcPrompt=exactPcPrompts.find(x=>x.includes('MODO PRICECHARTING'))||'';\nassert.ok(exactPcPrompt,'No se ejecutó la llamada específica de PriceCharting');\nassert.match(exactPcPrompt,/^Busca precios actuales para: Eomer 1982\\./);\nassert.match(exactPcPrompt,/NO puedes quitarlo ni buscar solo el nombre/);\nassert.match(exactPcPrompt,/q=Eomer%201982/);\nassert.equal(exactPcQueryResearch.asking.count,1);\nassert.equal(exactPcQueryResearch.asking.median,14.4);\nassert.equal(exactPcQueryResearch.comparables[0].url,'https://www.pricecharting.com/game/funko-pop-movies/eomer-1982');");
          fs.writeFileSync(p,t);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated patch
        run: |
          rm scripts/force-funko-number-search.mjs
          rm .github/workflows/one-shot-force-funko-number.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Force Funko name and number pricing search"
          git push
