name: Apply figure multipack identity patch

on:
  push:
    branches: [fix/figure-multipack-identification]
    paths:
      - scripts/patch-figure-multipack-identity.py
      - .github/workflows/one-shot-figure-multipack-identity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-figure-multipack-identity.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit patched prompt
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs
          git commit -m 'Improve boxed multipack figure identification'
          git push origin HEAD:fix/figure-multipack-identification
