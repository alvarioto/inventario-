name: Strict hobbyDB generic matching

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-strict-hobbydb-generic.py
      - .github/workflows/one-shot-strict-hobbydb-generic.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-strict-hobbydb-generic.py
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Check backend
        run: node --check api/hobbydb-value.mjs
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/api.ts api/hobbydb-value.mjs tests/core.mjs
          git commit -m 'Require exact generic hobbyDB identity'
          git push origin main
