name: Apply research JSON fix

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch-research-json.cjs
      - .github/workflows/one-shot-research-json-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-research-json.cjs
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/lib/ai-core.mjs tests/core.mjs
          git commit -m 'Make research resilient to malformed DeepSeek JSON'
          git push origin main
