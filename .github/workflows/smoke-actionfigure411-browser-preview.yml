name: Smoke ActionFigure411 browser preview

on:
  push:
    branches: [codex/actionfigure411-browser-search]
    paths:
      - .github/workflows/smoke-actionfigure411-browser-preview.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test Iron Man Mark LXXXV and Thanos through preview browser endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://frikivault-hobbydb-api-git-codex-actionf-551517-aldipo7292-6258.vercel.app/api/actionfigure411-value'
          BODY='{"item":{"type":"figure","title":"Hasbro Marvel Legends Series The Infinity Saga Iron Man Mark LXXXV & Thanos F0192","character":"Iron Man Mark LXXXV & Thanos","manufacturer":"Hasbro","line":"Marvel Legends Series","franchise":"Marvel","edition":"The Infinity Saga","sku":"F0192"}}'
          code=$(curl -sS --max-time 70 -o response.json -w '%{http_code}' -X POST "$URL" -H 'Content-Type: application/json' --data "$BODY")
          echo "HTTP $code"
          cat response.json
          echo
          test "$code" = "200"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("response.json","utf8"));if(x.status!=="completed"||x.value?.source!=="ActionFigure411"||!(x.value?.soldAverage>0))throw new Error("ActionFigure411 browser smoke did not return a sold-market estimate");console.log("SMOKE OK",x.value.title,x.value.soldAverage,x.value.currency,x.value.url)'
