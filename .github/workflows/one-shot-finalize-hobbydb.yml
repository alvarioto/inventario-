name: Finalize hobbyDB Funko pricing
on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-hobbydb-funko.mjs
      - .github/workflows/one-shot-finalize-hobbydb.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final cleanup
        run: node scripts/finalize-hobbydb-funko.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated cleanup
        run: |
          rm scripts/finalize-hobbydb-funko.mjs
          rm .github/workflows/one-shot-finalize-hobbydb.yml
          git config user.name alvarioto
          git config user.email aldipo7292@gmail.com
          git add -A
          git commit -m "Finalize hobbyDB Funko pricing"
          git push
