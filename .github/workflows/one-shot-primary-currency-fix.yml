name: Fix primary value currency

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-primary-currency.py
      - .github/workflows/one-shot-primary-currency-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch-primary-currency.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'alvarioto'
          git config user.email 'aldipo7292@gmail.com'
          git add src/App.tsx
          git commit -m 'Keep primary value currency consistent with selector'
          git push origin main
