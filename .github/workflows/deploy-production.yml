name: FrikiVault producción
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: true
# Siempre publica únicamente la revisión más reciente de main ya validada por tests y build.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: frikivault-alvarioto-2026
    steps:
      - name: Comprobar acceso de despliegue
        shell: bash
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo '::error::Añade FIREBASE_TOKEN en Settings > Secrets and variables > Actions del repositorio.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Obtener la configuración web desde Firebase
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools apps:list WEB --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/firebase-apps.json"
          APP_ID=$(node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/firebase-apps.json","utf8"));const app=data.result?.[0];if(!app?.appId)throw Error("No hay una app web en el proyecto");process.stdout.write(app.appId)')
          npx --yes firebase-tools apps:sdkconfig WEB "$APP_ID" --project "$FIREBASE_PROJECT_ID" --json > "$RUNNER_TEMP/firebase-web.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/firebase-web.json', 'utf8')).result;
          const config = result.sdkConfig || result;
          if (!config.apiKey || !config.appId || !config.authDomain || config.projectId !== process.env.FIREBASE_PROJECT_ID) {
            throw new Error('Configuración de Firebase incompleta o de otro proyecto.');
          }
          const entries = {
            VITE_FIREBASE_API_KEY: config.apiKey,
            VITE_FIREBASE_AUTH_DOMAIN: config.authDomain,
            VITE_FIREBASE_PROJECT_ID: config.projectId,
            VITE_FIREBASE_MESSAGING_SENDER_ID: config.messagingSenderId || '',
            VITE_FIREBASE_APP_ID: config.appId,
            VITE_DEMO_MODE: 'false'
          };
          for (const value of Object.values(entries)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error('Valor de configuración inválido.');
          }
          fs.writeFileSync('.env.local', Object.entries(entries).map(([key,value]) => key + '=' + value).join('\n') + '\n');
          NODE
      - run: npm run check:config
      - run: npm test
      - run: npm run build
      - name: Publicar Firebase Hosting y reglas privadas
        run: npx --yes firebase-tools deploy --non-interactive --only hosting,firestore:rules --project "$FIREBASE_PROJECT_ID"
