name: FrikiVault producción
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Comprobar acceso de despliegue
        shell: bash
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo '::error::Falta FIREBASE_TOKEN en este entorno de GitHub. La sesion de PowerShell no se transfiere a GitHub Actions.'
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo '::error::Falta FIREBASE_PROJECT_ID en este entorno de GitHub.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Preparar configuración web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          cat > .env.local <<EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_API_BASE_URL=$VITE_API_BASE_URL
          VITE_DEMO_MODE=false
          EOF
      - run: npm run check:config
      - run: npm run build
      - name: Firebase Hosting producción
        run: npx --yes firebase-tools deploy --non-interactive --only hosting,firestore:rules --project "$FIREBASE_PROJECT_ID"

